auth:
  bearer: ${AUTH_BEARER}

travel:
  origin_vasp: KC01
  peer_vasp: PEER
  # 旅行规则金额门槛：挂 usd_rates 后按美元名义比较；稳定币面值近似 USD。未命中走廊回落 default_threshold。
  default_threshold: "1000"
  usd_rates:
    BTC: "65000"
    ETH: "3500"
    SOL: "150"
    KCS: "10"
  corridors:
    - corridor: SG>US
      asset: USDT
      min_amount: "1000"
    - corridor: SG>JP
      asset: USDT
      min_amount: "1000"
    - corridor: DEFAULT
      min_amount: "1000"

compliance:
  case_ttl: 24h
custody:
  hsm: cloud-kms
ha:
  region: sg
  service: ledger
