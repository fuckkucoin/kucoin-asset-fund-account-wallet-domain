# 内部主机用目录名。MySQL/Redis/Kafka 分别绑 mysql-0 / redis-0 / kafka-0。
name: kucoin-account-assets

x-app-env: &app-env
  MYSQL_DSN: spotwallet:localdev@tcp(mysql-0.kucoin.net)/spotwallet?parseTime=true&charset=utf8mb4&multiStatements=true
  REDIS_ADDR: redis-0.kucoin.net:6379
  KAFKA_BROKERS: kafka-0.kucoin.net:9092
  KAFKA_OPTIONAL: "true"
  APP_PROFILE: mem
  AUTH_KIND: mem
  KMS_KIND: file
  KYT_MODE: allow
  CHAIN_DRIVER: rpc

services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_ROOT_PASSWORD: localdev
      MYSQL_DATABASE: spotwallet
      MYSQL_USER: spotwallet
      MYSQL_PASSWORD: localdev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"]
    ports:
      - "13306:3306"
    networks:
      default:
        aliases:
          - mysql-0.kucoin.net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql-0.kucoin.net", "-plocaldev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "16379:6379"
    networks:
      default:
        aliases:
          - redis-0.kucoin.net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://redpanda:9092,external://redpanda:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://kafka-0.kucoin.net:19092
      - --pandaproxy-addr
      - internal://redpanda:8082,external://redpanda:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://kafka-0.kucoin.net:18082
      - --smp
      - "1"
      - --memory
      - 256M
      - --mode
      - dev-container
      - --default-log-level
      - warn
    ports:
      - "19092:19092"
      - "18082:18082"
    networks:
      default:
        aliases:
          - kafka-0.kucoin.net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.+true'"]
      interval: 8s
      timeout: 5s
      retries: 20

  api:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BIN: api
    env_file:
      - ../.env.example
    environment:
      <<: *app-env
      HTTP_ADDR: ":18480"
      GRPC_ADDR: ":18481"
      PROCESS_ROLE: api
    ports:
      - "18480:18480"
      - "18481:18481"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app

  walletd:
    profiles: ["apps"]
