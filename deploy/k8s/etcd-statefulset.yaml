# etcd 三节点 StatefulSet 说明级清单（SG 主写区）。
# 目录主机：etcd-0/1/2.kucoin.net；私网 10.18.0.10 / 10.18.0.14 / 10.18.0.15。
# TYO 备用区复用同名，地址改为 10.19.0.10 族；选主与写围栏见 internal/ha。
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: account-assets
  labels:
    app: etcd
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: account-assets
spec:
  serviceName: etcd
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: etcd
              topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.16
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -ec
            - |
              PEERS="etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380"
              exec etcd --name ${ETCD_NAME} \
                --data-dir /var/lib/etcd \
                --listen-client-urls http://0.0.0.0:2379 \
                --advertise-client-urls http://${ETCD_NAME}.etcd:2379 \
                --listen-peer-urls http://0.0.0.0:2380 \
                --initial-advertise-peer-urls http://${ETCD_NAME}.etcd:2380 \
                --initial-cluster ${PEERS} \
                --initial-cluster-token aa-etcd \
                --initial-cluster-state new
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
